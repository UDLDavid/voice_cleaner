name: Compilar .exe para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Descargar ffmpeg para Windows
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $bin = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName, (Join-Path $bin.DirectoryName ffprobe.exe) .

      - name: Compilar
        run: >
          pyinstaller --noconfirm --onefile --windowed --name LimpiarVoz
          --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;."
          --exclude-module torch --exclude-module matplotlib
          limpiar_voz.py

      - name: Probar el .exe
        shell: pwsh
        run: |
          .\ffmpeg.exe -v error -f lavfi -i testsrc=d=5:s=320x240:r=25 -f lavfi -i "anoisesrc=d=5:c=pink:a=0.1" -c:v libx264 -c:a aac -shortest prueba.mp4
          $p = Start-Process dist\LimpiarVoz.exe -ArgumentList "prueba.mp4" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path prueba_limpio.mp4)) { throw "El .exe falló (código $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: LimpiarVoz-windows
          path: dist/LimpiarVoz.exe
